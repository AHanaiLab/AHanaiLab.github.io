<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>きょうの暮らし | SaQRA</title><meta name="description" content="この2週間の生活の質を、全体評価・影響した領域・経験・大切なこと・希望の5つの短い質問で振り返ります。WHOQOL-BREFの考え方を参考にした対話形式で、LLMやサーバーは使わずブラウザ内だけで完結します。"><!-- SaQRA サブページ「きょうの暮らし」（対話型ePRO試作、WHOQOL-BREFベース）。研究開発マップ＋検索は index.html --><style>
:root{--ink:#263e39;--muted:#6b7c76;--green:#23684f;--pale:#edf3e7;--line:#dfe6dc;--bg:#f8f9f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit;background:white;border:1px solid var(--line);border-radius:12px;padding:11px 12px}button:hover{border-color:var(--green);background:#f3f7ef}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b77d31;outline-offset:3px}header,main{max-width:740px;margin:auto}header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center;font-weight:650}.mark{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 8px 50%;background:var(--green);color:white}.small,.hint{font-size:11px;color:var(--muted)}main{padding:28px 22px 40px}.progress{display:flex;align-items:center;gap:5px;margin:0 0 26px;font-size:11px;color:var(--muted)}.dot{width:25px;height:4px;border-radius:5px;background:#dce4d6}.dot.on{background:var(--green)}.progress span:last-child{margin-left:7px}.msg{display:none;gap:9px;margin:0 0 20px}.msg:last-child{display:flex}.msg.user{display:none}.avatar{flex:0 0 27px;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#e5efdc;color:var(--green)}.bubble{max-width:94%;white-space:pre-wrap;font-size:17px;line-height:1.75}.basis{display:inline;margin-left:8px;font-size:9px;color:var(--muted)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.choices button{font-size:12px;text-align:center}.scale{grid-template-columns:repeat(6,1fr)}.scale button{padding:9px 3px}.composer{display:flex;align-items:center;gap:7px;padding:6px;border:1px solid #b8cbbd;border-radius:14px;background:white}textarea{flex:1;width:0;height:42px;min-height:42px;resize:none;border:0;background:transparent;padding:8px;color:var(--ink);font-size:13px}textarea:focus{outline:0}.send{min-width:42px;padding:7px;border:0;background:var(--green);color:white;font-size:18px}.result{padding:18px;border:1px solid var(--line);border-radius:16px;background:white}.result h2{margin:0 0 10px;font-size:17px}.result dl{margin:0}.result dl>div{display:grid;grid-template-columns:42% 1fr;gap:8px;padding:5px 0;border-top:1px solid #edf0ea}.result dt{font-size:10px;color:var(--muted)}.result dd{margin:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.primary{width:100%;margin-top:10px;background:var(--green);border-color:var(--green);color:white}.optional{margin-top:14px}.optional summary{cursor:pointer;font-size:11px;color:var(--muted)}.optional button{margin:8px 4px 0 0;padding:8px 10px;font-size:11px}.optional pre{max-height:260px;overflow:auto;padding:12px;background:white;font-size:10px;white-space:pre-wrap;word-break:break-word}.status,footer{font-size:10px;color:var(--muted)}footer{margin-top:14px}footer a{color:var(--muted)}[hidden]{display:none!important}.sitenav{display:flex;gap:12px}.sitenav a[aria-current]{color:var(--ink);font-weight:650}@media(max-width:540px){header{padding:15px 16px}main{padding:22px 16px}.choices,.scale{grid-template-columns:repeat(3,1fr)}.bubble{font-size:15px}.basis{display:block;margin:3px 0 0}.result{padding:14px}}
</style></head><body><header><div class="brand"><span class="mark">↗</span>きょうの暮らし</div><nav class="sitenav small"><a href="index.html">研究開発マップ＋検索</a><a href="icf.html" aria-current="page">きょうの暮らし</a></nav></header><main><div id="progress" class="progress" aria-live="polite"></div><div id="chat" role="log" aria-live="polite" aria-label="生活の質についての対話"></div><div id="inputArea"><div id="choices" class="choices"></div><form id="form" class="composer"><textarea id="message" aria-label="自由に入力する" placeholder="自由入力" maxlength="2000"></textarea><button class="send" aria-label="回答を送信">↑</button></form></div><section id="result" class="result" hidden></section><p id="status" class="status"></p><details id="extras" class="optional" hidden><summary>任意機能</summary><button data-extra="continue">続ける</button><button data-extra="future">50年後</button><button data-extra="world">未来の一日</button><button data-extra="edit">見直す</button><details class="optional"><summary>JSONデータ</summary><pre id="dataPreview"></pre></details></details><details class="optional"><summary>質問の根拠</summary><p class="hint">WHOQOL-BREFの過去2週間、全体評価、4領域を使用。ICFは文脈整理に使用。</p><p class="hint">OARSの開かれた質問、反映、要約を参考にし、不足やニーズは推定しません。</p><p class="hint">正式なWHOQOL-BREFの実施・採点ではありません。</p><p class="hint"><a href="https://www.who.int/tools/whoqol" target="_blank" rel="noopener">WHOQOL</a> ／ <a href="https://www.who.int/publications/i/item/WHOQOL-BREF" target="_blank" rel="noopener">WHOQOL-BREF</a> ／ <a href="https://www.who.int/classifications/international-classification-of-functioning-disability-and-health" target="_blank" rel="noopener">ICF</a> ／ <a href="https://www.mirecc.va.gov/visn1/docs/products/Project_START_MI-N_Manual.pdf" target="_blank" rel="noopener">OARS</a></p></details><footer>回答はブラウザ内だけで処理し、サーバーには送信されません。 ／ <a href="guide.html">ハッカソン参加者ガイド</a> ／ <a href="icf.html" download="icf.html">このページのHTMLを保存</a></footer></main><script>
'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={whoqol:'https://www.who.int/tools/whoqol',bref:'https://www.who.int/publications/i/item/WHOQOL-BREF',icf:'https://www.who.int/classifications/international-classification-of-functioning-disability-and-health',oars:'https://www.mirecc.va.gov/visn1/docs/products/Project_START_MI-N_Manual.pdf'};
const D={physical:{name:'身体的健康',whoqol:'Physical health',facets:'日常生活、エネルギー、移動、痛み、睡眠、仕事能力',icf:'心身機能（b）・活動と参加（d）'},psychological:{name:'心理',whoqol:'Psychological',facets:'感情、自尊感情、思考・学習・記憶・集中、信念',icf:'精神機能（b1）・個人の価値（ICF外の個人因子）'},social:{name:'社会的関係',whoqol:'Social relationships',facets:'個人的関係、社会的支援',icf:'対人関係（d7）・支援と関係（e3）'},environment:{name:'環境',whoqol:'Environment',facets:'安全、住環境、医療・福祉へのアクセス、情報、余暇、交通、経済的資源',icf:'環境因子（e）・地域生活や余暇（d9）'}};
const B=[{label:'全体評価',evidence:'WHOQOL-BREFの過去2週間と全体的な生活の質の評価。',source:S.bref},{label:'領域選択',evidence:'WHOQOL-BREFの4領域。影響した領域は本人が選択。',source:S.bref},{label:'領域の経験',evidence:'選択領域のfacetとICF文脈。良し悪しは推定しない。',source:S.bref},{label:'意味・価値',evidence:'WHOQOLの定義にある目標・期待・基準・関心。',source:S.whoqol},{label:'望む方向',evidence:'ICFの環境因子と活動参加、OARSの開かれた質問・反映・要約。',source:S.icf}];
let st={schema_version:'5.0.0',created_at:new Date().toISOString(),step:0,answers:{overall:null,domain:null,experience:null,meaning:null,direction:null},messages:[],history:[],editing:null,followup:false,optional_worlds:[],completed_at:null};
const W='この2週間の生活の質を、全体としてどう感じていますか？';
function say(role,text,basis=null){st.messages.push({role,text,time:new Date().toISOString(),basis})}function refl(t){return t?'「'+t+'」と感じておられるのですね。':'この質問は飛ばして、次へ進みます。'}
function q(i){if(i===0)return W;if(i===1)return refl(st.answers.overall)+'\n特に関係が深い領域はどれですか？';if(i===2){const d=D[st.answers.domain];return d?d.name+'について、この2週間にどんな経験がありましたか？\n観点：'+d.facets:'この2週間で、生活の質に関係した経験はありましたか？'}if(i===3)return refl(st.answers.experience)+'\nその経験で、大切だと感じたことは何ですか？';return refl(st.answers.meaning)+'\nこれから大切にしたいことや、希望する支えはありますか？'}
function opts(i){if(i===0)return ['とても良い','良い','どちらともいえない','良くない','とても良くない'];if(i===1)return [...Object.entries(D).map(([value,d])=>({value,label:d.name})),{value:'none',label:'一つに決めない'}];if(i===2)return ['良かった経験を話す','気になった経験を話す','良い面と気になる面がある','今は言葉にしにくい'];if(i===3)return ['自分らしくいられること','人とのつながり','安心・心地よさ','役割・やりがい','まだ言葉にしにくい'];return ['今のまま大切にしたい','少し変えてみたい','支えについて考えたい','特にない・今は決めない']}
function accept(raw){const text=String(raw).trim();if(!text)return;const i=st.editing===null?st.step:st.editing;if(i>4){if(!st.followup)return;say('user',text);say('assistant',refl(text)+'\nほかに振り返りたいことはありますか？',{label:'OARS：単純な反映',method:'simple reflection',source:S.oars});st.history.push({field:'followup',after:text,time:new Date().toISOString()});$('message').value='';render();return}const key=['overall','domain','experience','meaning','direction'][i],value=/^(答えない|スキップ)$/.test(text)?null:text;st.history.push({field:key,before:st.answers[key],after:value,time:new Date().toISOString(),basis:B[i]});st.answers[key]=value;say('user',D[value]?.name??value??'回答なし');$('message').value='';$('status').textContent='';if(st.editing!==null){st.editing=null;say('assistant','更新しました。')}else{st.step++;if(st.step<5)say('assistant',q(st.step),B[st.step]);else{st.completed_at=new Date().toISOString();say('assistant','振り返りをまとめました。',{label:'OARS：要約',method:'summary',source:S.oars})}}render()}
function ontology(){const d=D[st.answers.domain];return d?[{whoqol_domain:d.whoqol,label:d.name,facets:d.facets,icf_context:d.icf,source:'user_selected',interpretation:'context only; no deficit, severity or need inferred'}]:[]}function data(){return {...structuredClone(st),assessment:{instrument:'conversational adaptation informed by WHOQOL-BREF',validated_instrument:false,official_score:null,recall_period:'past two weeks',overall_self_report:st.answers.overall,domain_selected_by_user:st.answers.domain,interpretation:'No dissatisfaction, deficit, severity or need inferred.'},ontology_context:ontology(),question_basis:B,dialogue_method:{style:'OARS-informed open questions, simple reflections and summary',clinical_counselling:false},backend_submission:false}}
function render(){const i=st.editing??st.step;$('progress').innerHTML=[0,1,2,3,4].map(n=>'<span class="dot '+(n<st.step?'on':'')+'"></span>').join('')+'<span>'+(st.editing!==null?'見直し':st.step===5?'完了':(st.step+1)+' / 5')+'</span>';$('chat').innerHTML=st.messages.map(m=>'<div class="msg '+m.role+'">'+(m.role==='assistant'?'<span class="avatar">↗</span>':'')+'<div class="bubble">'+esc(m.text)+(m.basis?'<span class="basis">'+esc(m.basis.label)+'</span>':'')+'</div></div>').join('');$('chat').hidden=st.step===5&&!st.followup&&st.editing===null;$('inputArea').hidden=i>4&&!st.followup;$('form').hidden=false;$('choices').className='choices'+(i===0?' scale':'');$('choices').innerHTML=(i<5?opts(i):[]).map(o=>{const v=typeof o==='string'?o:o.value,l=typeof o==='string'?o:o.label;return '<button type="button" data-answer="'+esc(v)+'">'+esc(l)+'</button>'}).join('')+(i<5?'<button data-answer="答えない">回答しない</button>':'');$('result').hidden=st.step<5||st.editing!==null;$('extras').hidden=st.step<5||st.editing!==null;if(st.step===5){const d=D[st.answers.domain];$('result').innerHTML='<h2>振り返り</h2><dl><div><dt>生活の質</dt><dd>'+esc(st.answers.overall??'回答なし')+'</dd></div><div><dt>領域</dt><dd>'+esc(d?.name??'一つに絞らない／回答なし')+'</dd></div><div><dt>経験</dt><dd>'+esc(st.answers.experience??'回答なし')+'</dd></div><div><dt>大切なこと</dt><dd>'+esc(st.answers.meaning??'回答なし')+'</dd></div><div><dt>希望</dt><dd>'+esc(st.answers.direction??'回答なし')+'</dd></div></dl><button class="primary" id="download">JSON保存 ↓</button>';$('download').onclick=download}$('dataPreview').textContent=JSON.stringify(data(),null,2);const end=st.step===5&&!st.followup&&st.editing===null?$('result'):$('form');if(st.messages.length>1)end.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}
function download(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data(),null,2)],{type:'application/json;charset=utf-8'}));a.href=url;a.download='qol-epro-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='保存用ファイルを作成しました。'}
function extra(kind){if(kind==='continue'){st.followup=true;say('assistant','ほかに振り返りたいことはありますか？',{label:'OARS：開かれた質問',method:'open question',source:S.oars});render();$('message').focus();return}if(kind==='edit'){st.followup=false;$('choices').innerHTML=['全体評価','領域','経験','大切なこと','希望'].map((t,i)=>'<button data-edit="'+i+'">'+t+'</button>').join('');$('inputArea').hidden=false;$('form').hidden=true;return}const d=D[st.answers.domain];st.optional_worlds.push({year:2076,kind,whoqol_domain:d?.whoqol??null,icf_context:d?.icf??null,value:st.answers.meaning,direction:st.answers.direction,status:'hypothetical_not_forecast'});say('user',kind==='future'?'50年後':'未来の一日');say('assistant','50年後、AIや住環境、制度が暮らしを支えるとしたら、'+(st.answers.meaning?'「'+st.answers.meaning+'」はどう保たれていてほしいですか？':'何を大切にしたいですか？'));st.followup=true;render()}
$('form').onsubmit=e=>{e.preventDefault();accept($('message').value)};$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();accept(e.target.value)}};document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.answer!==undefined)accept(b.dataset.answer);if(b.dataset.extra)extra(b.dataset.extra);if(b.dataset.edit!==undefined){st.editing=Number(b.dataset.edit);st.followup=false;say('assistant',q(st.editing),B[st.editing]);render()}});say('assistant',W,B[0]);render();
</script></body></html>
